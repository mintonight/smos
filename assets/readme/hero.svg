    <text x="162" y="250" font-size="21" fill="#566679">抖音</text>
    <circle cx="225" cy="242" r="2" fill="#566679"/>
    <text x="245" y="250" font-size="21" fill="#566679">知乎</text>
    <circle cx="308" cy="242" r="2" fill="#566679"/>
    <text x="328" y="250" font-size="21" fill="#566679">小红书</text>
    <circle cx="432" cy="242" r="2" fill="#566679"/>
    <text x="452" y="250" font-size="21" fill="#566679">X</text>
    <circle cx="478" cy="242" r="2" fill="#566679"/>
    <text x="498" y="250" font-size="21" fill="#566679">YouTube</text>
  </g>
  <path d="M782 48v204" stroke="#d8dfe7"/>
  <circle cx="919" cy="132" r="50" fill="none" stroke="#16202c" stroke-width="14"/>
