<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc">
  <title id="title">SMOS — 首页，只留搜索。</title>
  <desc id="desc">Social Media Only Search。支持 Bilibili、抖音、知乎、小红书、X 与 YouTube。右侧为抽象搜索图标，不是产品界面。</desc>
  <rect width="1120" height="300" rx="16" fill="#f6f7f9"/>
  <g font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <path d="M48 48h24" stroke="#d63251" stroke-width="4"/>
    <text x="84" y="55" font-size="20" font-weight="700" letter-spacing="2" fill="#16202c">SMOS</text>
    <text x="177" y="54" font-size="13" letter-spacing="1.8" fill="#566679">SOCIAL MEDIA ONLY SEARCH</text>
    <text x="46" y="160" font-size="64" font-weight="700" letter-spacing="-1" fill="#16202c">首页，只留搜索。</text>
    <path d="M48 204h656" stroke="#d8dfe7"/>
