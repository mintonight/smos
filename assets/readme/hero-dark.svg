<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc">
  <title id="title">SMOS — 首页，只留搜索。</title>
  <desc id="desc">Social Media Only Search。支持 Bilibili、抖音、知乎和小红书。右侧为抽象搜索图标，不是产品界面。</desc>
  <rect width="1120" height="300" rx="16" fill="#15191f"/>
  <g font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <path d="M48 48h24" stroke="#fb7185" stroke-width="4"/>
    <text x="84" y="55" font-size="20" font-weight="700" letter-spacing="2" fill="#f1f5f9">SMOS</text>
    <text x="177" y="54" font-size="13" letter-spacing="1.8" fill="#9aa7b5">SOCIAL MEDIA ONLY SEARCH</text>
    <text x="46" y="160" font-size="64" font-weight="700" letter-spacing="-1" fill="#f1f5f9">首页，只留搜索。</text>
    <path d="M48 204h656" stroke="#303a46"/>
    <text x="48" y="250" font-size="21" fill="#9aa7b5">Bilibili</text>
    <circle cx="142" cy="242" r="2" fill="#9aa7b5"/>
    <text x="162" y="250" font-size="21" fill="#9aa7b5">抖音</text>
    <circle cx="225" cy="242" r="2" fill="#9aa7b5"/>
    <text x="245" y="250" font-size="21" fill="#9aa7b5">知乎</text>
    <circle cx="308" cy="242" r="2" fill="#9aa7b5"/>
    <text x="328" y="250" font-size="21" fill="#9aa7b5">小红书</text>
  </g>
  <path d="M782 48v204" stroke="#303a46"/>
  <circle cx="919" cy="132" r="50" fill="none" stroke="#f1f5f9" stroke-width="14"/>
  <path d="m956 169 50 50" stroke="#fb7185" stroke-width="16" stroke-linecap="round"/>
</svg>
