<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>SMOS README hero preview</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
    .light { padding: 24px; background: #ffffff; }
    .dark { padding: 24px; background: #0d1117; }
    .label { margin: 0 0 10px; font: 12px/1.4 ui-monospace, monospace; letter-spacing: 0.08em; text-transform: uppercase; }
    .light .label { color: #57606a; }
    .dark .label { color: #8b949e; }
    img { display: block; width: 900px; max-width: 100%; height: auto; }
    .mobile { width: 360px; max-width: 100%; margin-top: 12px; }
  </style>
</head>
<body>
  <section class="light">
    <p class="label">GitHub light · 900px</p>
    <img src="hero.svg" alt="SMOS hero preview on light background">
  </section>
  <section class="dark">
    <p class="label">GitHub dark · 900px / mobile 360px</p>
    <img src="hero.svg" alt="SMOS hero preview on dark background">
    <img class="mobile" src="hero.svg" alt="SMOS hero preview at mobile width">
  </section>
</body>
</html>
